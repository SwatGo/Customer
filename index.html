  function phoneToShopId(phone) { let hash = 0; const str = String(phone || ""); for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash = hash & hash; } return Math.abs(hash) % 100000000; }

  function merchantToShop(docId, data) {

  function startCustomerOrdersListener() {
    if (!state.user || !state.user.phone) return;
    if (customerOrdersListener) customerOrdersListener();
    console.log('=== CUSTOMER ORDERS LISTENER: Starting for', state.user.phone);
    const q = query(collection(db, "orders"), where("userId", "==", state.user.phone));
    customerOrdersListener = onSnapshot(q, (snap) => {
      const firestoreOrders = [];
      snap.forEach(d => firestoreOrders.push({ id: d.id, ...d.data() }));
      firestoreOrders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const localOnly = state.orders.filter(lo => !firestoreOrders.some(fo => fo.id === lo.id));
      state.orders = [...firestoreOrders, ...localOnly];
      saveLocal();
      console.log('=== CUSTOMER ORDERS UPDATED:', state.orders.length, 'orders');
      if (state.tab === "orders") render();
    }, (err) => { console.error('Customer orders listener error:', err); });
  }

  function stopCustomerOrdersListener() {
    if (customerOrdersListener) {
      customerOrdersListener();
      customerOrdersListener = null;
      console.log('=== CUSTOMER ORDERS LISTENER: Stopped');

  }

  async function requestFcmToken() { if (!window.FcmBridge) return; window.onFcmTokenReceived = async function(token) { if (!token) return; localStorage.setItem('swatgo_fcm_token', token); await saveFcmTokenToFirestore(token); }; window.FcmBridge.postMessage('getFcmToken'); }
  async function saveFcmTokenToFirestore(token) { if (!state.user) return; try { const phoneKey = state.user.phone.replace(/[^0-9]/g, ''); await setDoc(doc(db, 'device_tokens', 'customer_' + phoneKey), { token, userType: 'customer', userId: state.user.phone, userName: state.user.name, updatedAt: new Date().toISOString(), platform: 'android' }, { merge: true }); } catch (e) { console.error(e); } }
  async function removeFcmToken() { if (!state.user) return; try { const phoneKey = state.user.phone.replace(/[^0-9]/g, ''); await deleteDoc(doc(db, 'device_tokens', 'customer_' + phoneKey)); } catch (e) { console.error(e); } }

  function saveLocal() { localStorage.setItem("syedgo_user", JSON.stringify(state.user)); localStorage.setItem("syedgo_cart", JSON.stringify(state.cart)); localStorage.setItem("syedgo_orders", JSON.stringify(state.orders)); localStorage.setItem("syedgo_fav", JSON.stringify(state.favorites)); localStorage.setItem("syedgo_addr", JSON.stringify(state.address)); localStorage.setItem("syedgo_coupon", JSON.stringify(state.coupon)); localStorage.setItem("syedgo_loc", state.location); }
  function save() { saveLocal(); saveToFirebase(); }

  function toast(msg, type) { const t = document.getElementById("toast"); t.textContent = msg; t.className = "toast " + (type || ""); t.classList.add("show"); clearTimeout(window._t); window._t = setTimeout(() => t.classList.remove("show"), 2400); }
  function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }
  function findProduct(id) { for (const s of getAllShops()) { const p = s.products.find(x => String(x.id) === String(id)); if (p) return { ...p, shopId: s.id, shopName: s.name }; } return null; }
  function cartCount() { return state.cart.reduce((a, b) => a + b.qty, 0); }
  function cartSubtotal() { return state.cart.reduce((a, b) => a + b.price * b.qty, 0); }

  function calculateDistanceKm(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2) ** 2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function deliveryFee() {
    if (!state.cart.length) return 0;
    const ratePerKm = state.settings.RATE_PER_KM || 40;
    const minFee = state.settings.MIN_DELIVERY_FEE || 50;
    const maxFee = state.settings.MAX_DELIVERY_FEE || 500;
    const customerLat = state.address.lat, customerLng = state.address.lng;
    if (!customerLat || !customerLng) return minFee;
    const shopNames = [...new Set(state.cart.map(i => i.shopName).filter(Boolean))];
    const firstShop = findShopByName(shopNames[0]);
    if (!firstShop || !firstShop.location || !firstShop.location.lat) return state.settings.DEFAULT_DELIVERY || 150;
    const straightKm = calculateDistanceKm(firstShop.location.lat, firstShop.location.lng, customerLat, customerLng);
    const roadKm = straightKm * 1.3;
    let fee = Math.round(roadKm * ratePerKm);
    return Math.max(minFee, Math.min(maxFee, fee));
  }

  function calculateRiderEarning() {
    const riderPerKm = state.settings.RIDER_PER_KM || 30;
    const customerLat = state.address.lat, customerLng = state.address.lng;
    if (!customerLat || !customerLng) return state.settings.RIDER_CUT || 120;
    const shopNames = [...new Set(state.cart.map(i => i.shopName).filter(Boolean))];
    const firstShop = findShopByName(shopNames[0]);
    if (!firstShop || !firstShop.location || !firstShop.location.lat) return state.settings.RIDER_CUT || 120;
    const straightKm = calculateDistanceKm(firstShop.location.lat, firstShop.location.lng, customerLat, customerLng);
    const roadKm = straightKm * 1.3;
    const riderEarning = Math.round(roadKm * riderPerKm);
    console.log(`💰 Rider Earning: ${roadKm.toFixed(2)} km × Rs ${riderPerKm} = Rs ${riderEarning}`);
    return riderEarning;
  }

  function getDistanceText() {
    if (!state.cart.length) return '';
    const cLat = state.address.lat, cLng = state.address.lng;
    if (!cLat || !cLng) return '';
    const shopNames = [...new Set(state.cart.map(i => i.shopName).filter(Boolean))];
    const firstShop = findShopByName(shopNames[0]);
    if (!firstShop || !firstShop.location) return '';
    const km = calculateDistanceKm(firstShop.location.lat, firstShop.location.lng, cLat, cLng) * 1.3;
    return `(${km.toFixed(1)} km)`;
  }

  function platformFee() { return state.cart.length ? state.settings.PLATFORM_FEE : 0; }
  function discountAmount() { if (!state.coupon) return 0; const c = COUPONS[state.coupon]; if (!c) return 0; const sub = cartSubtotal(); if (sub < c.min) return 0; if (c.type === "percent") return Math.round(sub * c.value / 100); if (c.type === "flat") return c.value; if (c.type === "shipping") return deliveryFee(); return 0; }
  function cartTotal() { return Math.max(0, cartSubtotal() + deliveryFee() + platformFee() - discountAmount()); }
  function updateBadge() { const b = document.getElementById("cartBadge"); const n = cartCount(); if (n > 0) { b.textContent = n; b.classList.remove("hidden"); } else b.classList.add("hidden"); }
  function toggleFav(shopId, e) { if(e) e.stopPropagation(); const i = state.favorites.indexOf(shopId); if (i >= 0) { state.favorites.splice(i, 1); toast("Removed from favourites", "info"); } else { state.favorites.push(shopId); toast("Added to favourites", "success"); } save(); render(); }
  function addToCart(pid, qty = 1) { const p = findProduct(pid); if (!p) return; const ex = state.cart.find(i => String(i.id) === String(pid)); if (ex) ex.qty += qty; else state.cart.push({ id: p.id, name: p.name, price: p.price, qty, shopName: p.shopName }); save(); updateBadge(); render(); toast(p.name + " added", "success"); }
  function changeQty(id, delta) { const item = state.cart.find(i => String(i.id) === String(id)); if (!item) return; item.qty += delta; if (item.qty <= 0) state.cart = state.cart.filter(i => String(i.id) !== String(id)); save(); updateBadge(); render(); }

  function openShop(id) { state.currentShop = id; render(); window.scrollTo(0,0); }
  function backToHome() { state.currentShop = null; render(); }

  function normalizePhoneForLink(phone) { if (!phone) return ""; return String(phone).replace(/[^0-9]/g, ""); }
  function openRiderWhatsApp(riderPhone, riderName) { if (!riderPhone) return toast("Rider phone not available", "warning"); const cleaned = normalizePhoneForLink(riderPhone); if (!cleaned) return toast("Invalid rider phone", "error"); const msg = encodeURIComponent(`Assalam o Alaikum ${riderName || 'Rider'}, this is your customer from SwatGo.`); window.open(`https://wa.me/${cleaned}?text=${msg}`, "_blank"); }
  function callRider(riderPhone) { if (!riderPhone) return toast("Rider phone not available", "warning"); const cleaned = normalizePhoneForLink(riderPhone); if (!cleaned) return toast("Invalid rider phone", "error"); window.location.href = `tel:+${cleaned}`; }
  function contactRiderFromOrder(orderId) { const o = state.orders.find(x => x.id === orderId); if (!o) return; if (!o.rider || !o.rider.phone) return toast("Rider not assigned yet", "info"); openRiderWhatsApp(o.rider.phone, o.rider.name); }

  function chatWithMerchant(orderId) {
    const o = state.orders.find(x => x.id === orderId); if (!o) return;
    const shopName = (o.items || [])[0]?.shopName || "Store";
    const shop = findShopByName(shopName);
    if (!shop || !shop.merchantPhone) return toast("Merchant phone not available", "warning");
    const phone = String(shop.merchantPhone).replace(/[^0-9]/g, '');
    if (!phone) return toast("Invalid merchant phone", "error");
    const message = `Assalam o Alaikum ${shop.name},\n\nMera order #${o.id} hai.\n\nOrder details:\n${(o.items || []).map(i => `• ${i.name} × ${i.qty}`).join('\n')}\n\nTotal: Rs ${o.total}\n\nKuch kehna tha is order ke bare mein.`;
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, "_blank");
  }

    }

        <div style="display:flex;justify-content:space-between;align-items:flex-start;"><div><h3 style="font-size:18px;">${s.name}</h3><p style="margin-top:4px;font-size:12px;">${s.category} • ⭐ ${s.rating}</p><p style="margin-top:4px;font-size:12px;color:var(--accent);font-weight:700;">🕒 ${s.hours}</p>${s.address ? `<p style="margin-top:4px;font-size:12px;">📍 ${s.address}</p>` : ""}</div><button onclick="toggleFav(${s.id})" style="background:none;border:none;font-size:26px;cursor:pointer;">${state.favorites.includes(s.id)?'❤️':'🤍'}</button></div>
        <button class="add-btn" style="width:100%;margin-top:14px;background:var(--bg);color:var(--text);box-shadow:none;border:1px solid var(--border);" onclick="openReviews('${s.name.replace(/'/g,"\\'")}')">⭐ Read Reviews</button>

      ${s.products.length === 0 ? '<div class="empty">' + emptyShopsSVG() + '<h3>No products yet</h3></div>' : s.products.map(p => `<div class="card" onclick="openProduct(${p.id})" style="cursor:pointer;padding:14px;"><div class="product-row" style="padding:0;border:none;"><div class="product-info"><h4>${p.name} ${p.stock === false ? '<span style="color:var(--danger);font-size:10px;font-weight:700;">(Out of stock)</span>' : ''}</h4><p style="color:var(--brand);font-weight:800;margin-top:4px;">Rs ${p.price}</p><p style="font-size:12px;color:var(--text-light);margin-top:4px;font-weight:500;">${p.desc}</p></div>${p.stock !== false ? `<button class="add-btn" onclick="event.stopPropagation(); addToCart(${p.id})">+ Add</button>` : ''}</div></div>`).join("")}`;
  }

  function openProduct(pid) {
    const p = findProduct(pid); if (!p) return;
    document.getElementById("modalRoot").innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div style="height:180px;background:linear-gradient(135deg, var(--brand-light), #A7F3D0);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:80px;margin-bottom:16px;">🍽️</div><h3>${p.name}</h3><p style="font-size:14px;color:var(--text-light);margin:8px 0 16px;">${p.desc}</p><div style="font-size:22px;font-weight:800;color:var(--brand);margin-bottom:16px;font-feature-settings:'tnum';">Rs ${p.price}</div><div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;"><span style="font-size:14px;font-weight:700;">Quantity:</span><div class="qty-box"><button onclick="let q=document.getElementById('prodQty'); if(q.value>1)q.value--;">−</button><input type="number" id="prodQty" value="1" min="1" style="width:50px;text-align:center;border:1px solid var(--border);border-radius:10px;padding:8px;font-weight:800;background:var(--input-bg);color:var(--text);" readonly><button onclick="document.getElementById('prodQty').value++;">+</button></div></div><button class="checkout-btn" onclick="let q=parseInt(document.getElementById('prodQty').value); addToCart(${p.id}, q); closeModal();">Add to Cart - Rs ${p.price}</button><button class="add-btn" style="width:100%;margin-top:10px;background:var(--bg);color:var(--text);box-shadow:none;border:1px solid var(--border);" onclick="closeModal()">Cancel</button></div></div>`;
  }

  function renderSearchResults() {
    const q = state.searchQuery.toLowerCase().trim(); if (!q) return "";
    let res = [];
    getAllShops().forEach(s => { if (s.name.toLowerCase().includes(q) || s.category.toLowerCase().includes(q)) res.push({ type: "shop", data: s }); s.products.forEach(p => { if (p.name.toLowerCase().includes(q) || (p.desc || "").toLowerCase().includes(q)) res.push({ type: "product", data: { ...p, shop: s.name } }); }); });
    if (state.searchFilter === "price_low") res.sort((a,b) => (a.type==='product'?a.data.price:0) - (b.type==='product'?b.data.price:0));
    if (state.searchFilter === "price_high") res.sort((a,b) => (b.type==='product'?b.data.price:0) - (a.type==='product'?a.data.price:0));
    if (!res.length) return '<div class="empty">' + emptySearchSVG() + '<h3>No results found</h3><p>Try a different search term</p></div>';
    return res.map(r => r.type === "shop" ? `<div class="card" onclick="openShop(${r.data.id})"><div class="shop-header"><div class="shop-img">${r.data.emoji}</div><div class="shop-info"><h3>${r.data.name}</h3><p>${r.data.category}</p></div></div></div>` : `<div class="card"><div class="product-row" style="border:none;padding:0;"><div class="product-info" onclick="openProduct(${r.data.id})"><h4>${r.data.name}</h4><p>${r.data.shop} • Rs ${r.data.price}</p></div><button class="add-btn" onclick="addToCart(${r.data.id})">+ Add</button></div></div>`).join("");
  }

  function renderSearch() { return `<h2>🔍 Search</h2><input id="searchInput" class="search-input" placeholder="Search for shops, food, products..." value="${state.searchQuery}" oninput="state.searchQuery=this.value; document.getElementById('searchResults').innerHTML=renderSearchResults()" /><div class="filter-chips"><div class="filter-chip ${state.searchFilter==='all'?'active':''}" onclick="state.searchFilter='all';render()">All</div><div class="filter-chip ${state.searchFilter==='price_low'?'active':''}" onclick="state.searchFilter='price_low';render()">💰 Low Price</div><div class="filter-chip ${state.searchFilter==='price_high'?'active':''}" onclick="state.searchFilter='price_high';render()">💎 High Price</div></div><div id="searchResults">${renderSearchResults()}</div>${!state.searchQuery ? `<div class="empty">${emptySearchSVG()}<h3>What are you looking for?</h3><p>Try searching "milk", "burger", or "medicine"</p></div>` : ""}`; }

  function renderCart() {
    if (!state.cart.length) return `<h2>🛒 Your Cart</h2><div class="empty">${emptyCartSVG()}<h3>Your cart is empty</h3><p>Add items from your favourite shops to get started</p><button class="checkout-btn" style="max-width:200px;margin:0 auto;" onclick="state.tab='home';render()">Browse Shops</button></div>`;
    const sub = cartSubtotal(), df = deliveryFee(), pf = platformFee(), disc = discountAmount(), total = cartTotal();
    const distText = getDistanceText();
    return `<h2>🛒 Your Cart</h2><div class="card">${state.cart.map(i => `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);"><div><h4 style="font-size:14px;font-weight:700;">${i.name}</h4><p style="font-size:12px;color:var(--text-light);font-weight:500;">${i.shopName} • Rs ${i.price}</p></div><div class="qty-box"><button onclick="changeQty(${i.id},-1)">−</button><span>${i.qty}</span><button onclick="changeQty(${i.id},1)">+</button></div></div>`).join("")}</div><div class="card"><div class="fee-row"><span>Subtotal</span><span>Rs ${sub}</span></div><div class="fee-row"><span>Delivery ${distText}</span><span>Rs ${df}</span></div><div class="fee-row"><span>Platform Fee</span><span>Rs ${pf}</span></div>${disc>0?`<div class="fee-row" style="color:var(--success)"><span>Discount</span><span style="color:var(--success);">-Rs ${disc}</span></div>`:""}<div class="fee-row total"><span>Total</span><span>Rs ${total}</span></div></div><div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;"><div style="font-size:13px;font-weight:600;">🎟️ ${state.coupon ? "Coupon: <b style='color:var(--brand);'>"+state.coupon+"</b>" : "Have a coupon?"}</div>${state.coupon ? `<button class="add-btn" style="background:var(--danger);box-shadow:none;" onclick="state.coupon=null;save();render()">Remove</button>` : `<button class="add-btn" onclick="applyCoupon()">Apply</button>`}</div><button class="checkout-btn" onclick="openCheckout()">Proceed to Checkout →</button>`;
  }

  function openCheckout() {
    if (state.cart.length === 0) return toast("Cart is empty", "warning");
    if (!state.user) { toast("Please login first", "info"); state.tab = "profile"; render(); return; }
    const sub = cartSubtotal(), df = deliveryFee(), pf = platformFee(), disc = discountAmount(), total = cartTotal();
    const distText = getDistanceText();
    document.getElementById("modalRoot").innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><h3>Confirm Order</h3><div style="background:var(--bg);border-radius:14px;padding:16px;margin-bottom:16px;border:1px solid var(--border);cursor:pointer;" onclick="openLocationModal()"><div style="display:flex;justify-content:space-between;align-items:center;"><div><b style="font-weight:700;">📍 ${state.address.label || 'Delivery Address'}</b><br><span style="font-size:12px;color:var(--text-light);font-weight:500;">${state.address.details || 'Tap to set address'}</span></div><span style="font-size:22px;color:var(--brand);">›</span></div></div><div style="font-size:13px;color:var(--text-light);margin-bottom:8px;font-weight:600;">Delivery / Pickup</div><div class="pay-opt active" id="optDelivery"><input type="radio" name="mode" value="delivery" checked onchange="updateMode()" /><div><b>Delivery</b><div style="font-size:12px;color:var(--text-light);font-weight:500;">Rs ${df} ${distText}</div></div></div><div class="pay-opt" id="optPickup"><input type="radio" name="mode" value="pickup" onchange="updateMode()" /><div><b>Pickup</b><div style="font-size:12px;color:var(--text-light);font-weight:500;">Free</div></div></div><div style="font-size:13px;color:var(--text-light);margin:16px 0 8px;font-weight:600;">Payment Method</div><div class="pay-opt active"><input type="radio" name="pay" value="cod" checked /><div style="font-size:22px;">💵</div><div><b>Cash on Delivery</b><div style="font-size:11px;color:var(--text-light);font-weight:500;">Online payment coming soon</div></div></div><div class="fee-breakdown"><div class="fee-row"><span>Subtotal</span><span>Rs ${sub}</span></div><div class="fee-row"><span>Delivery ${distText}</span><span id="dfLabel">Rs ${df}</span></div><div class="fee-row"><span>Platform Fee</span><span>Rs ${pf}</span></div>${disc > 0 ? `<div class="fee-row" style="color:var(--success);"><span>Discount</span><span style="color:var(--success);">-Rs ${disc}</span></div>` : ""}<div class="fee-row total"><span>Total</span><span id="totalLabel">Rs ${total}</span></div></div><button class="checkout-btn" onclick="placeOrder()">Place Order</button><button class="add-btn" style="width:100%;margin-top:10px;background:var(--bg);color:var(--text);box-shadow:none;border:1px solid var(--border);" onclick="closeModal()">Cancel</button></div></div>`;
    window._mode = "delivery"; window._pay = "cod";
  }

  function updateMode() {
    const m = document.querySelector('input[name="mode"]:checked').value; window._mode = m;
    document.getElementById("optDelivery").classList.toggle("active", m === "delivery");
    document.getElementById("optPickup").classList.toggle("active", m === "pickup");
    const sub = cartSubtotal(), df = m === "delivery" ? deliveryFee() : 0, pf = platformFee(); let disc = discountAmount();
    if (state.coupon === "FREESHIP" && m === "pickup") disc = 0;
    document.getElementById("dfLabel").textContent = "Rs " + df;
    document.getElementById("totalLabel").textContent = "Rs " + Math.max(0, sub + df + pf - disc);
  }

  async function placeOrder() {
    const mode = window._mode, pay = "cod";
    const sub = cartSubtotal();
    const df = mode === "delivery" ? deliveryFee() : 0;
    const pf = platformFee();
    const disc = discountAmount();
    const total = Math.max(0, sub + df + pf - disc);
    const orderId = "SW" + Date.now().toString().slice(-6);
    const shopNames = [...new Set(state.cart.map(i => i.shopName).filter(Boolean))];
    const firstShop = findShopByName(shopNames[0]);
    const pickup = firstShop ? { name: firstShop.name, address: firstShop.address || '', phone: firstShop.merchantPhone || '', location: firstShop.location || null } : { name: shopNames[0] || 'Store', address: '', phone: '', location: null };

    const order = { id: orderId, userId: state.user.phone, userName: state.user.name, userPhone: state.user.phone, items: [...state.cart], subtotal: sub, delivery: df, platformFee: pf, discount: disc, total, mode, pay, address: state.address, pickup, status: "Placed", createdAt: new Date().toISOString(), rider: null, riderEarning: calculateRiderEarning(), timeline: ["Placed"] };
    state.orders.unshift(order);
    state.cart = [];
    state.coupon = null;
    save(); updateBadge(); closeModal(); state.tab = "orders"; render();
    toast("Order placed! #" + orderId, "success");
    try { await setDoc(doc(db, "orders", orderId), order); } catch (e) { console.error(e); toast("Cloud sync failed", "error"); }
  }

  async function cancelOrder(orderId) {
    const o = state.orders.find(x => x.id === orderId); if (!o) return;
    if (["Rider Assigned", "Picked Up", "On the Way", "Delivered"].includes(o.status)) return toast("Rider already assigned. Cannot cancel.", "error");
    if (!confirm("Cancel this order?")) return;
    try {
      await updateDoc(doc(db, "orders", orderId), { status: "Cancelled", cancelledAt: new Date().toISOString(), cancelledBy: "Customer" });
      o.status = "Cancelled"; o.timeline = [...(o.timeline || []), "Cancelled"];
      saveLocal(); toast("Order cancelled", "info"); render();
    } catch (e) { console.error(e); toast("Failed to cancel", "error"); }
  }

  function openTracking(orderId) {
    const o = state.orders.find(x => x.id === orderId); if (!o) return;
    if (o.status === "Cancelled") return toast("Order was cancelled", "error");
    document.getElementById("modalRoot").innerHTML = `<div class="overlay" onclick="if(event.target===this) closeTracking()"><div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><h3 style="margin:0;">Track #${o.id}</h3><button class="add-btn" style="background:var(--bg);color:var(--text);box-shadow:none;border:1px solid var(--border);" onclick="closeTracking()">✕</button></div><div id="liveTrackingMap"></div><div id="riderInfoBox"></div><div id="timelineBox"></div></div></div>`;
    setTimeout(() => initLiveTrackingMap(o), 150);
  }

  function initLiveTrackingMap(order) {
    const mapEl = document.getElementById("liveTrackingMap"); if (!mapEl) return;
    const customerPos = order.address?.lat && order.address?.lng ? { lat: order.address.lat, lng: order.address.lng } : DEFAULT_CENTER;
    liveMap = new google.maps.Map(mapEl, { center: customerPos, zoom: 14, disableDefaultUI: true, zoomControl: true, styles: [{ featureType: "poi", stylers: [{ visibility: "off" }] }] });
    liveCustomerMarker = new google.maps.Marker({ position: customerPos, map: liveMap, icon: { url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"><path fill="#0f172a" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`), scaledSize: new google.maps.Size(40, 40) } });
    riderLocationListener = onSnapshot(doc(db, "rider_locations", order.id), (snap) => {
      if (snap.exists() && snap.data().location) {
        const riderPos = { lat: snap.data().location.latitude, lng: snap.data().location.longitude };
        if (liveRiderMarker) smoothMoveMarker(liveRiderMarker, riderPos);
        else liveRiderMarker = new google.maps.Marker({ position: riderPos, map: liveMap, icon: { url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#22c55e" stroke="#fff" stroke-width="2"/><text x="12" y="16" text-anchor="middle" font-size="13">🛵</text></svg>`), scaledSize: new google.maps.Size(44, 44) } });
        const bounds = new google.maps.LatLngBounds(); bounds.extend(customerPos); bounds.extend(riderPos);
        liveMap.fitBounds(bounds, { top: 60, bottom: 60, left: 60, right: 60 });
      }
    });
    orderStatusListener = onSnapshot(doc(db, "orders", order.id), (snap) => {
      if (snap.exists()) {
        const data = snap.data();
        const localOrder = state.orders.find(x => x.id === order.id);
        if (localOrder) { localOrder.status = data.status || localOrder.status; localOrder.rider = data.rider || localOrder.rider; saveLocal(); }
        const riderBox = document.getElementById("riderInfoBox");
        if (riderBox && data.rider && data.rider.phone) {
          const rPhone = data.rider.phone;
          const rName = (data.rider.name || "Rider").replace(/'/g, "\\'");
          riderBox.innerHTML = `<div class="rider-contact-box"><div class="info"><b>🛵 ${data.rider.name || 'Rider'}</b><span>${data.rider.bike || 'Motorcycle'} • ⭐ ${data.rider.rating || '5.0'}</span></div><div class="actions"><button class="icon-action call" onclick="callRider('${rPhone}')">📞</button><button class="icon-action wa" onclick="openRiderWhatsApp('${rPhone}', '${rName}')">💬</button></div></div>`;
        }
        const timelineBox = document.getElementById("timelineBox");
        if (timelineBox) {
          const steps = ["Placed", "Accepted by Store", "Ready for Pickup", "Rider Assigned", "Picked Up", "On the Way", "Delivered"];
          const currentIdx = steps.indexOf(data.status);
          const isCancelled = data.status === "Cancelled";
          timelineBox.innerHTML = `<div class="timeline">${steps.map((step, i) => { let cls = "timeline-step"; if (isCancelled) cls += " cancelled"; else if (i < currentIdx) cls += " done"; else if (i === currentIdx) cls += " active"; return `<div class="${cls}"><h4>${step}</h4><p>${isCancelled ? 'Cancelled' : (i <= currentIdx ? 'Completed' : 'Pending')}</p></div>`; }).join("")}</div>`;
        }
      }
    });
  }

  function smoothMoveMarker(marker, newPos) { const oldPos = marker.getPosition(); if (!oldPos) { marker.setPosition(newPos); return; } const steps = 20, latStep = (newPos.lat - oldPos.lat()) / steps, lngStep = (newPos.lng - oldPos.lng()) / steps; let i = 0; const timer = setInterval(() => { i++; marker.setPosition({ lat: oldPos.lat() + latStep * i, lng: oldPos.lng() + lngStep * i }); if (i >= steps) clearInterval(timer); }, 30); }
  function closeTracking() { if (riderLocationListener) { riderLocationListener(); riderLocationListener = null; } if (orderStatusListener) { orderStatusListener(); orderStatusListener = null; } liveMap = null; liveRiderMarker = null; liveCustomerMarker = null; closeModal(); }

  function openRating(orderId) {
    const o = state.orders.find(x => x.id === orderId); if (!o) return;
    const shopName = (o.items || [])[0]?.shopName || "";
    const riderPhone = o.rider?.phone || "";
    const riderName = o.rider?.name || "";
    window._storeRating = 0; window._riderRating = 0;
    document.getElementById("modalRoot").innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><h3>⭐ Rate Your Order</h3><p style="font-size:13px;color:var(--text-light);margin-bottom:16px;font-weight:500;">Order #${o.id}</p><div style="text-align:center;margin-bottom:8px;font-weight:700;">${shopName || "Store"}</div><div class="stars" id="storeStars">${[1,2,3,4,5].map(i => `<span class="star" onclick="setStar('store',${i})">★</span>`).join("")}</div>${riderName ? `<div style="text-align:center;margin:16px 0 8px;font-weight:700;">🛵 ${riderName}</div><div class="stars" id="riderStars">${[1,2,3,4,5].map(i => `<span class="star" onclick="setStar('rider',${i})">★</span>`).join("")}</div>` : ''}<textarea id="reviewText" placeholder="Write your review (optional)..." rows="3" style="margin-top:16px;"></textarea><button class="checkout-btn" style="background:linear-gradient(135deg,#F59E0B,#D97706);box-shadow:0 6px 20px rgba(245,158,11,0.3);" onclick="submitRating('${orderId}', '${shopName.replace(/'/g,"\\'")}', '${riderPhone}')">Submit Rating</button><button class="add-btn" style="width:100%;margin-top:10px;background:var(--bg);color:var(--text);box-shadow:none;border:1px solid var(--border);" onclick="closeModal()">Cancel</button></div></div>`;
  }

  function setStar(type, val) { if (type === 'store') { window._storeRating = val; document.querySelectorAll('#storeStars .star').forEach((s, i) => s.classList.toggle('active', i < val)); } else { window._riderRating = val; document.querySelectorAll('#riderStars .star').forEach((s, i) => s.classList.toggle('active', i < val)); } }

  async function submitRating(orderId, shopName, riderPhone) {
    if (!window._storeRating && !window._riderRating) return toast("Please rate at least one", "warning");
    const reviewText = document.getElementById("reviewText")?.value.trim() || "";
    const o = state.orders.find(x => x.id === orderId); if (!o) return;
    try {
      if (shopName && window._storeRating > 0) await setDoc(doc(db, "reviews", "rev_" + Date.now() + "_store"), { type: "store", storeName: shopName, orderId, customerPhone: state.user.phone, customerName: state.user.name, rating: window._storeRating, text: reviewText, createdAt: new Date().toISOString() });
      if (riderPhone && window._riderRating > 0) await setDoc(doc(db, "reviews", "rev_" + Date.now() + "_rider"), { type: "rider", riderPhone, orderId, customerPhone: state.user.phone, customerName: state.user.name, rating: window._riderRating, text: reviewText, createdAt: new Date().toISOString() });
      await updateDoc(doc(db, "orders", orderId), { rated: true, ratedAt: new Date().toISOString() });
      o.rated = true; saveLocal(); closeModal(); toast("Thanks for your feedback!", "success"); render();
    } catch (e) { console.error(e); toast("Failed to submit rating", "error"); }
  }

  function openReviews(storeName) {
    document.getElementById("modalRoot").innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><h3 style="margin:0;">⭐ ${storeName} Reviews</h3><button class="add-btn" style="background:var(--bg);color:var(--text);box-shadow:none;border:1px solid var(--border);" onclick="closeModal()">✕</button></div><div id="reviewsList"><div class="empty">Loading reviews...</div></div></div></div>`;
    const q = query(collection(db, "reviews"), where("type", "==", "store"), where("storeName", "==", storeName));
    onSnapshot(q, (snap) => {
      const reviews = [];
      snap.forEach(d => reviews.push({ id: d.id, ...d.data() }));
      reviews.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const list = document.getElementById("reviewsList"); if (!list) return;
      if (reviews.length === 0) { list.innerHTML = '<div class="empty">No reviews yet. Be the first!</div>'; return; }
      const avg = (reviews.reduce((s, r) => s + (r.rating || 0), 0) / reviews.length).toFixed(1);
      list.innerHTML = `<div class="card" style="text-align:center;background:var(--bg);"><div style="font-size:34px;font-weight:800;color:var(--accent);">⭐ ${avg}</div><p style="font-size:12px;font-weight:600;">${reviews.length} review${reviews.length > 1 ? 's' : ''}</p></div>` + reviews.map(r => `<div class="review-item"><div class="review-header"><b style="font-size:13px;">${r.customerName || 'Customer'}</b><span class="review-stars">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</span></div>${r.text ? `<p class="review-text">${r.text}</p>` : ''}<p class="review-meta">${new Date(r.createdAt).toLocaleDateString()}</p></div>`).join("");
    });
  }

  let pickerMap = null, pickerMarker = null;

  function openLocationModal() {
    document.getElementById("modalRoot").innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><h3>📍 Delivery Address</h3><label style="display:block;font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px;">Enter your full address *</label><textarea id="addrDetails" placeholder="e.g. Mingora Bazar, near Bank Alfalah, House 123" rows="3" style="width:100%;padding:14px;border:1px solid var(--border);border-radius:14px;font-size:14px;background:var(--input-bg);color:var(--text);font-family:inherit;resize:none;margin-bottom:12px;font-weight:500;">${state.address.details || ''}</textarea><button class="add-btn" onclick="goToMyLocation()" style="width:100%;margin-bottom:12px;background:linear-gradient(135deg,#3B82F6,#2563EB);box-shadow:0 4px 12px rgba(59,130,246,0.25);padding:12px;font-size:13px;">📍 Use My Current Location</button><details style="margin-bottom:12px;"><summary style="cursor:pointer;font-size:12px;color:var(--text-light);padding:8px 0;font-weight:600;">🎯 Adjust on map (optional)</summary><div id="pickerMap" style="width:100%;height:220px;border-radius:14px;margin-top:8px;background:var(--bg);"></div><p style="font-size:11px;text-align:center;color:var(--text-light);margin-top:6px;font-weight:500;">Drag pin or tap map</p></details><div style="display:flex;gap:8px;margin-bottom:12px;"><div class="filter-chip ${state.address.label==='Home'?'active':''}" onclick="setAddressLabel('Home')">🏠 Home</div><div class="filter-chip ${state.address.label==='Office'?'active':''}" onclick="setAddressLabel('Office')">🏢 Office</div><div class="filter-chip ${state.address.label==='Other'?'active':''}" onclick="setAddressLabel('Other')">📍 Other</div></div><label style="display:block;font-size:12px;color:var(--text-light);margin-bottom:4px;font-weight:600;">Delivery Instructions (optional)</label><input id="addrInstructions" placeholder="Call before arriving, house color..." value="${state.address.instructions || ''}" /><button class="checkout-btn" onclick="saveAddress()">Save Address</button><button class="add-btn" style="width:100%;margin-top:10px;background:var(--bg);color:var(--text);box-shadow:none;border:1px solid var(--border);" onclick="closeModal()">Cancel</button></div></div>`;
    setTimeout(() => initPickerMap(), 150);
  }

  function initPickerMap() {
    const el = document.getElementById("pickerMap"); if (!el) return;
    const startPos = state.address.lat && state.address.lng ? { lat: state.address.lat, lng: state.address.lng } : DEFAULT_CENTER;
    pickerMap = new google.maps.Map(el, { center: startPos, zoom: 15, disableDefaultUI: true, zoomControl: true });
    pickerMarker = new google.maps.Marker({ position: startPos, map: pickerMap, draggable: true, icon: { url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png" } });
    const handleGeocode = (lat, lng) => { new google.maps.Geocoder().geocode({ location: { lat, lng } }, (results, status) => { const input = document.getElementById('addrDetails'); if (status === "OK" && results[0] && results[0].formatted_address && input && !input.value) input.value = results[0].formatted_address; }); };
    google.maps.event.addListener(pickerMarker, 'dragend', () => { const pos = pickerMarker.getPosition(); state.address.lat = pos.lat(); state.address.lng = pos.lng(); handleGeocode(pos.lat(), pos.lng()); });
    pickerMap.addListener('click', (e) => { pickerMarker.setPosition(e.latLng); state.address.lat = e.latLng.lat(); state.address.lng = e.latLng.lng(); handleGeocode(e.latLng.lat(), e.latLng.lng()); });
  }

  function goToMyLocation() {
    if (!navigator.geolocation) return toast("GPS not supported", "error");
    toast("Getting your location...", "info");
    navigator.geolocation.getCurrentPosition((pos) => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      state.address.lat = lat; state.address.lng = lng;
      if (pickerMap) { pickerMap.setCenter({ lat, lng }); pickerMap.setZoom(17); }
      if (pickerMarker) pickerMarker.setPosition({ lat, lng });
      new google.maps.Geocoder().geocode({ location: { lat, lng } }, (results, status) => { const input = document.getElementById("addrDetails"); if (status === "OK" && results[0] && results[0].formatted_address && input) input.value = results[0].formatted_address; });
      toast("Location detected", "success");
    }, (err) => { toast(err.code === 1 ? "Permission blocked" : "Error: " + err.message, "error"); }, { enableHighAccuracy: true, timeout: 15000 });
  }

  function setAddressLabel(label) { state.address.label = label; openLocationModal(); }

  function saveAddress() {
    const details = document.getElementById('addrDetails').value.trim();
    const instructions = document.getElementById('addrInstructions').value.trim();
    if (!details) return toast("Please enter your address", "warning");
    state.address.details = details;
    state.address.instructions = instructions;
    save(); closeModal(); toast("Address saved", "success"); render();
  }

  function openAuth() {
    document.getElementById("modalRoot").innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><h3>Login to SwatGo</h3><div id="authStep1"><p style="font-size:13px;color:var(--text-light);margin-bottom:14px;font-weight:500;">Enter your phone number to continue</p><input id="aPhone" placeholder="+92 300 1234567" type="tel" /><button class="checkout-btn" onclick="checkAndLogin()">Continue</button></div><div id="authStep2" class="hidden"><p style="text-align:center;margin-bottom:16px;font-weight:600;">👋 Welcome!</p><input id="aName" placeholder="Full Name" /><input id="aEmail" placeholder="Email (optional)" type="email" /><button class="checkout-btn" onclick="completeSignup()">Create Account</button><button class="add-btn" style="width:100%;margin-top:10px;background:var(--bg);color:var(--text);box-shadow:none;border:1px solid var(--border);" onclick="backToStep1()">← Change Phone</button></div><button class="add-btn" style="width:100%;margin-top:10px;background:var(--bg);color:var(--text);box-shadow:none;border:1px solid var(--border);" onclick="closeModal()">Cancel</button></div></div>`;
    setTimeout(() => document.getElementById('aPhone')?.focus(), 100);
  }

  async function checkAndLogin() {
    const input = document.getElementById('aPhone').value.trim(); if (!input) return toast("Enter phone number", "warning");
    let phone = input.replace(/[\s\-()]/g, "");
    if (phone.startsWith("0")) phone = "+92" + phone.slice(1);
    else if (phone.startsWith("92") && !phone.startsWith("+")) phone = "+" + phone;
    else if (!phone.startsWith("+")) phone = "+92" + phone;
    window._phone = phone; toast("Checking...", "info");
    try {
      const snap = await getDoc(doc(db, "users", phone));
      if (snap.exists()) {
        const data = snap.data();
        state.user = data.user || { name: "SwatGo User", phone };
        state.cart = data.cart || []; state.orders = data.orders || [];
        state.address = data.address || { label: "Home", details: "", instructions: "", lat: null, lng: null };
        state.favorites = data.favorites || []; state.location = data.location || "Swat, Pakistan";
        saveLocal(); closeModal(); render();
        toast("Welcome back, " + state.user.name, "success");
        requestFcmToken();
        startCustomerOrdersListener();
      } else {
        document.getElementById('authStep1').classList.add('hidden');
        document.getElementById('authStep2').classList.remove('hidden');
      }
    } catch (e) { console.error(e); toast("Network error", "error"); }
  }

  function backToStep1() { document.getElementById('authStep2').classList.add('hidden'); document.getElementById('authStep1').classList.remove('hidden'); }

  async function completeSignup() {
    const name = document.getElementById('aName').value.trim();
    const email = document.getElementById('aEmail').value.trim();
    if (!name) return toast("Enter your name", "warning");
    state.user = { name, phone: window._phone, email, createdAt: new Date().toISOString() };
    saveLocal(); await saveToFirebase(); closeModal(); render();
    toast("Welcome, " + name, "success");
    requestFcmToken();
    startCustomerOrdersListener();
  }

  async function logout() {
    if (!confirm("Logout?")) return;
    stopCustomerOrdersListener();
    await removeFcmToken();
    state.user = null; state.cart = []; state.orders = []; state.favorites = [];
    state.address = { label: "Home", details: "", instructions: "", lat: null, lng: null };
    state.coupon = null;
    localStorage.clear(); state.tab = "home"; render(); toast("Logged out", "info");
  }

  function renderOrders() {
    if (!state.orders.length) return `<h2>📦 My Orders</h2><div class="empty">${emptyOrdersSVG()}<h3>No orders yet</h3><p>Your order history will appear here</p><button class="checkout-btn" style="max-width:200px;margin:0 auto;" onclick="state.tab='home';render()">Start Ordering</button></div>`;
    return `<h2>📦 My Orders</h2>${state.orders.map(o => {
      const canCancel = ["Placed", "Accepted by Store", "Ready for Pickup"].includes(o.status);
      const isCancelled = ["Cancelled", "Rejected"].includes(o.status);
      const isDelivered = o.status === "Delivered";
      const hasRider = o.rider && o.rider.phone;
      const cls = getStatusClass(o.status);
      return `<div class="card" style="${isCancelled ? 'opacity:0.65;' : ''}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font-weight:800;">#${o.id}</b><span class="status-chip ${cls}">${o.status}</span></div>
        <p style="font-size:11px;color:var(--text-light);margin-bottom:10px;font-weight:500;">${new Date(o.createdAt).toLocaleString()}</p>
        ${o.items.map(i => `<div style="font-size:13px;display:flex;justify-content:space-between;padding:3px 0;font-weight:500;"><span>${i.name} × ${i.qty}</span><span style="font-feature-settings:'tnum';">Rs ${i.price*i.qty}</span></div>`).join("")}
        <div style="border-top:1px solid var(--border);margin-top:8px;padding-top:10px;font-size:14px;"><div style="display:flex;justify-content:space-between;font-weight:800;"><span>Total</span><span style="color:var(--brand);font-feature-settings:'tnum';">Rs ${o.total}</span></div></div>
        ${hasRider ? `<div style="margin-top:8px;font-size:12px;color:var(--brand);font-weight:700;">🛵 Rider: ${o.rider.name}</div>` : ''}
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
          ${!isCancelled ? `<button class="add-btn" style="flex:1;" onclick="openTracking('${o.id}')">📍 Track</button>` : ''}
          ${!isCancelled ? `<button class="add-btn" style="flex:1;background:linear-gradient(135deg,#25D366,#128C7E);box-shadow:0 4px 12px rgba(37,211,102,0.25);" onclick="chatWithMerchant('${o.id}')">💬 Store</button>` : ''}
          ${!isCancelled && !isDelivered && hasRider ? `<button class="add-btn" style="flex:1;background:linear-gradient(135deg,#F59E0B,#D97706);box-shadow:0 4px 12px rgba(245,158,11,0.25);" onclick="contactRiderFromOrder('${o.id}')">📞 Rider</button>` : ''}
          ${isDelivered && !o.rated ? `<button class="add-btn" style="flex:1;background:linear-gradient(135deg,#F59E0B,#D97706);box-shadow:0 4px 12px rgba(245,158,11,0.25);" onclick="openRating('${o.id}')">⭐ Rate</button>` : ''}
          ${isDelivered && o.rated ? `<button class="add-btn" style="flex:1;background:var(--brand-light);color:var(--brand-dark);box-shadow:none;">✅ Rated</button>` : ''}
          <button class="add-btn" style="flex:1;background:var(--bg);color:var(--text);box-shadow:none;border:1px solid var(--border);" onclick="reorder('${o.id}')">🔄 Reorder</button>
        </div>
        ${canCancel ? `<button class="add-btn" style="width:100%;margin-top:10px;background:linear-gradient(135deg,#EF4444,#DC2626);box-shadow:0 4px 12px rgba(239,68,68,0.25);padding:11px;" onclick="cancelOrder('${o.id}')">❌ Cancel Order</button>` : ''}
        ${!canCancel && !isCancelled && !isDelivered ? `<p style="font-size:11px;color:var(--text-light);text-align:center;margin-top:10px;font-weight:600;">⚠️ Rider assigned — cancellation not available</p>` : ''}
      </div>`;
    }).join("")}`;
  }

  function reorder(orderId) { const o = state.orders.find(x => x.id === orderId); if(!o) return; o.items.forEach(item => { const ex = state.cart.find(i => String(i.id) === String(item.id)); if(ex) ex.qty += item.qty; else state.cart.push({...item}); }); save(); updateBadge(); toast("Items added to cart", "success"); state.tab = "cart"; render(); }

  function renderProfile() {
    if (!state.user) return `<div class="card" style="text-align:center;padding:40px 20px;"><div style="font-size:64px;margin-bottom:16px;">👤</div><h3 style="margin-bottom:8px;font-size:18px;">Welcome to SwatGo</h3><p style="color:var(--text-light);font-size:13px;margin-bottom:20px;">Login to place orders and track deliveries</p><button class="checkout-btn" style="max-width:240px;margin:0 auto;" onclick="openAuth()">Login / Sign Up</button></div>`;
    return `<div class="card"><div style="display:flex;align-items:center;gap:16px"><div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg, #059669, #047857);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;">${(state.user.name || 'U')[0].toUpperCase()}</div><div><h3 style="font-size:17px;">${state.user.name}</h3><p style="font-size:13px;color:var(--text-light);font-weight:500;">${state.user.phone}</p></div></div></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);font-size:14px;cursor:pointer;" onclick="openLocationModal()"><span style="font-weight:600;">📍 Delivery Address</span><span style="color:var(--text-light);font-size:12px;font-weight:500;">${state.address.details ? state.address.details.slice(0,20)+'...' : 'Not set'}</span></div>
      <div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);font-size:14px;cursor:pointer;" onclick="state.tab='orders';render()"><span style="font-weight:600;">📦 My Orders</span><span style="color:var(--text-light);">›</span></div>
      <div style="display:flex;justify-content:space-between;padding:14px 0;font-size:14px;cursor:pointer;" onclick="toast('Support ticket created', 'info')"><span style="font-weight:600;">🎧 Help & Support</span><span style="color:var(--text-light);">›</span></div>
    </div>
    <button class="checkout-btn" style="background:linear-gradient(135deg,#EF4444,#DC2626);box-shadow:0 6px 20px rgba(239,68,68,0.3);" onclick="logout()">Logout</button>`;
  }

  function render() {
    const app = document.getElementById("app"); let html = "";
    if (state.currentShop) html = renderShop();
    else if (state.tab === "home") html = renderHome();
    else if (state.tab === "search") html = renderSearch();
    else if (state.tab === "cart") html = renderCart();
    else if (state.tab === "orders") html = renderOrders();
    else if (state.tab === "profile") html = renderProfile();
    app.innerHTML = html;
    document.querySelectorAll(".bottom-nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab));
    updateBadge();
  }

  document.querySelectorAll(".bottom-nav button").forEach(btn => { btn.addEventListener("click", () => { state.tab = btn.dataset.tab; state.currentShop = null; render(); window.scrollTo(0, 0); }); });

  function applyCoupon() { const code = prompt("Enter coupon code:\nSWAT10, WELCOME50, FREESHIP"); if (!code) return; const c = code.trim().toUpperCase(); if (COUPONS[c]) { state.coupon = c; save(); render(); toast("Coupon applied: " + c, "success"); } else toast("Invalid coupon code", "error"); }

  setTimeout(() => { document.getElementById('splash').style.opacity = '0'; setTimeout(() => document.getElementById('splash')?.remove(), 500); }, 2000);
  document.getElementById("locLabel").textContent = state.location;
  applyDarkMode();
  updateBadge(); render();
  loadSettings();
  setTimeout(loadMerchants, 500);
  if (state.user) requestFcmToken();
  if (state.user) startCustomerOrdersListener();

  window.setCategory = setCategory; window.openShop = openShop; window.backToHome = backToHome; window.addToCart = addToCart; window.changeQty = changeQty; window.toggleFav = toggleFav; window.openProduct = openProduct; window.openCheckout = openCheckout; window.updateMode = updateMode; window.placeOrder = placeOrder; window.openTracking = openTracking; window.closeTracking = closeTracking; window.openRating = openRating; window.setStar = setStar; window.submitRating = submitRating; window.openReviews = openReviews; window.openLocationModal = openLocationModal; window.setAddressLabel = setAddressLabel; window.saveAddress = saveAddress; window.openAuth = openAuth; window.checkAndLogin = checkAndLogin; window.backToStep1 = backToStep1; window.completeSignup = completeSignup; window.logout = logout; window.reorder = reorder; window.closeModal = closeModal; window.toast = toast; window.applyCoupon = applyCoupon; window.cancelOrder = cancelOrder; window.goToMyLocation = goToMyLocation;
  window.openRiderWhatsApp = openRiderWhatsApp; window.callRider = callRider; window.contactRiderFromOrder = contactRiderFromOrder; window.chatWithMerchant = chatWithMerchant;
  window.toggleDarkMode = toggleDarkMode;
</script>
</body>
</html>
